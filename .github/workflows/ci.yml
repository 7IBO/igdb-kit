name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the integration tests alone: a change on IGDB's side shows up without commits,
    # before the schema update of 06:00 (the two share the Twitch quota).
    - cron: "0 5 * * 1"
  # Manual runs. The "Version packages" PR, opened by github-actions, gets its required checks
  # once a maintainer approves or re-runs its pull_request run: dispatched runs don't count.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job for every offline check: each job is billed by the started minute, so the former seven
  # jobs cost seven minutes a run. The name stays the one the main branch's ruleset requires.
  check:
    name: Lint, typecheck, unit tests, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Generated schema is up to date
        run: bun run codegen && git diff --exit-code packages/igdb-kit/src/generated
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run --filter igdb-kit lint:package
      - name: Redis adapters
        run: bun run --filter igdb-kit test:redis
        env:
          REDIS_URL: redis://localhost:6379
      - name: Type tests on TypeScript 5.9, 6.0 and 7.0
        working-directory: packages/igdb-kit
        run: |
          for TSC in ../../node_modules/typescript-5.9/bin/tsc ../../node_modules/typescript-6.0/bin/tsc ../../node_modules/typescript/bin/tsc; do
            echo "tsc $($TSC --version)"
            $TSC --noEmit -p test/types
          done
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Smoke test on Node 20
        working-directory: packages/igdb-kit
        run: bash ../../scripts/smoke.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Smoke test on Node 22
        working-directory: packages/igdb-kit
        run: bash ../../scripts/smoke.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Smoke test on Node 24
        working-directory: packages/igdb-kit
        run: bash ../../scripts/smoke.sh

  integration:
    name: Integration tests (real IGDB API)
    runs-on: ubuntu-latest
    # Weekly and by hand only: the real API costs a minute and the Twitch quota on every run, and an
    # offline check covers each pull request. Run it by hand before merging a change to a request.
    # Needs TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET repository secrets.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run --filter igdb-kit test:integration
